name: astorya
description: "ASTORYA - modul AR story berbasis marker (ARCore/ARKit)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # AR (ARKit iOS / ARCore Android).
  #
  # PENTING: package asli `ar_flutter_plugin` (0.7.3, Nov 2022) TIDAK memiliki
  # fitur image tracking - isinya hanya plane detection + hit test.
  # `ar_flutter_plugin_plus` adalah fork dari plugin yang sama dengan API
  # identik + penambahan Image Tracking (marker), sehingga semua kode modul
  # ini tetap memakai pola ARView/ARSessionManager/ARObjectManager yang sama.
  #
  # DI-FORK lokal ke plugins/ar_flutter_plugin_plus agar native Android bisa
  # mengirim 4 sudut layar marker per frame (onMarkerCorners) untuk warp video
  # menempel pada marker. Versi pub.dev asli tidak punya fitur ini.
  ar_flutter_plugin_plus:
    path: plugins/ar_flutter_plugin_plus

  # Dua player terpisah (Voiceover + BGM) + stream posisi untuk sinkron subtitle
  just_audio: ^0.10.6

  # Transformasi matriks untuk menempelkan model di atas marker.
  # Ini dependency resmi ar_flutter_plugin_plus, dipakai eksplisit di modul AR.
  vector_math: ^2.2.0

  # Playback video (.mp4) sebagai overlay mengambang di atas marker.
  # Plugin AR tidak punya node video, jadi video dirender sebagai widget
  # Flutter biasa di atas ARView (lihat ArVideoOverlay).
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/markers/
    - assets/models/
    - assets/images/
    - assets/videos/
    - assets/audio/vo/
    - assets/audio/bgm/
